<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Steganography Demo</title>
  <style>
    body { font-family: Arial; max-width: 700px; margin: 40px auto; }
    .box { border: 1px solid #ddd; padding: 16px; border-radius: 12px; }
    label { display: block; margin-top: 12px; }
    button { margin-top: 16px; padding: 10px 14px; }
  </style>
</head>
<body>
  <h1>Steganography Demo</h1>
  <p>Upload a cover image + a secret image, pick a method, and download the output.</p>

  <div class="box">
    <form action="/encode" method="post" enctype="multipart/form-data">
      <label>Method:</label>
      <select name="method">
        {% for m in methods %}
          <option value="{{m}}">{{m}}</option>
        {% endfor %}
      </select>

      <label>Cover image:</label>
      <input type="file" name="cover" accept="image/*" required />

      <label>Secret image:</label>
      <input type="file" name="secret" accept="image/*" required />

      <button type="submit">Encode & Download</button>
    </form>
  </div>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <ul>
        {% for msg in messages %}
          <li style="color: red;">{{ msg }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}
</body>
</html>
